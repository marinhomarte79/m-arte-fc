# Mantém o projecto Supabase activo: no plano gratuito, um projecto sem uso durante 7 dias é pausado.
# Corre todos os dias às 06:17 (UTC) e também pode ser lançado à mão em Actions → "Manter Supabase activo" → Run workflow.
name: Manter Supabase activo

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: config.js
          sparse-checkout-cone-mode: false
      - name: Consultar a base de dados
        run: |
          URL=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' config.js | head -1)
          KEY=$(grep -oE 'eyJ[A-Za-z0-9._-]+' config.js | head -1)
          test -n "$URL" && test -n "$KEY" || { echo "Não encontrei o endereço ou a chave pública em config.js"; exit 1; }
          echo "Auth:"; curl -fsS -m 30 "$URL/auth/v1/health" -H "apikey: $KEY" -o /dev/null -w "%{http_code}\n"
          echo "Base de dados:"; curl -fsS -m 30 "$URL/rest/v1/clubs?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -o /dev/null -w "%{http_code}\n"
