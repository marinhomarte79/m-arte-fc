<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C3262C">
<meta name="robots" content="noindex">
<title>M ARTE FC Match Analyst</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;min-height:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="styles.css?v=202611032327">
</head>
<body>
<header class="top" id="hdr" hidden>
  <div class="top-in gut">
    <div class="brand"><b>M Arte FC</b><span id="hdrClub">Análise de jogo</span></div>
    <select class="hdr-sel" id="selClub" aria-label="Clube" hidden></select>
    <select class="hdr-sel" id="selTeam" aria-label="Equipa"></select>
    <div class="score" id="hdrScore"></div>
    <span class="sync" id="sync"><i></i>Ligado</span>
    <span class="user"><span id="hdrUser"></span><button id="btnLogout" type="button">Sair</button></span>
  </div>
  <nav class="tabs gut" id="tabs"></nav>
</header>
<main class="gut" id="app"></main>
<div class="toast" id="toast" hidden></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script src="supabase.js"></script>
<script src="config.js?v=202611032327"></script>
<script src="app.js?v=202611032327"></script>
</body>
</html>
