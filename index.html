<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<body>
<div class="shell">
<aside class="side" id="side" hidden>
  <a class="side-logo" href="#inicio" title="M Arte FC"><svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect x="3" y="7" width="26" height="18" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16" y1="7" x2="16" y2="25" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/></svg></a>
  <nav class="side-nav" id="tabs"></nav>
  <div class="side-foot"><div class="side-user" id="sideUser"></div><button id="btnLogout" type="button" class="side-out" title="Sair">Sair</button></div>
</aside>
<div class="mainwrap">
<header class="top" id="hdr" hidden>
  <div class="top-in">
    <span class="brand-logo" id="hdrLogo" hidden></span><div class="brand"><b>M Arte FC</b><span id="hdrClub">Análise de jogo</span></div>
    <select class="hdr-sel" id="selClub" aria-label="Clube" hidden></select>
    <select class="hdr-sel" id="selTeam" aria-label="Equipa"></select>
    <div class="score" id="hdrScore"></div>
    <span class="sync" id="sync"><i></i>Ligado</span>
    <span class="user"><span id="hdrUser"></span></span>
  </div>
</header>
<main class="gut" id="app"></main>
</div>
</div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
